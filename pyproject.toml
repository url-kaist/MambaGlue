[project]
name = "mambaglue"
description = "MambaGlue: Fast and Robust Local Feature Matching With Mamba"
version = "0.1"
authors = [
    {name = "Kihwan Ryoo"},
    {name = "Hyungtae Lim"},
    {name = "Hyun Myung"},
]
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
keywords = [
    "feature-matching",
    "local-features",
    "mamba",
    "state-space-model",
    "transformer",
    "computer-vision",
    "structure-from-motion",
    "visual-localization",
    "deep-learning",
    "pytorch",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: POSIX :: Linux",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Image Recognition",
]
dynamic = ["dependencies"]

[project.urls]
Repository = "https://github.com/url-kaist/MambaGlue"
Issues = "https://github.com/url-kaist/MambaGlue/issues"
Paper = "https://arxiv.org/abs/2502.00462"
"Glue Factory branch" = "https://github.com/url-kaist/MambaGlue/tree/glue-factory"
"hloc branch" = "https://github.com/url-kaist/MambaGlue/tree/hloc"

[project.optional-dependencies]
dev = ["black==23.12.1", "flake8", "isort"]
# Training reproduction extras. `gluefactory` itself is not installable from
# PyPI; install it separately (editable from a local clone or directly from
# https://github.com/cvg/glue-factory). See mambaglue/training/README.md.
train = ["h5py", "tensorboard", "pytlsd"]

[tool.setuptools]
packages = ["mambaglue", "mambaglue.training"]
include-package-data = true

[tool.setuptools.package-data]
"mambaglue.training" = ["configs/*.yaml", "run.sh"]

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}

[tool.isort]
profile = "black"
